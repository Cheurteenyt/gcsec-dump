name: Build gcsec-dump (.nro)

on:
  workflow_dispatch:
  push:
    paths:
      - "scene/gcsec-dump/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install devkitPro toolchain
        uses: devkitPro/install-toolchain-action@main
        with:
          toolchain: devkitA64 libnx mbedtls

      - name: Build
        working-directory: scene/gcsec-dump
        run: |
          export DEVKITPRO=/opt/devkitpro
          export PATH=$DEVKITPRO/bin:$PATH
          make

      - name: Upload .nro artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcsec-dump-nro
          path: scene/gcsec-dump/gcsec-dump.nro
