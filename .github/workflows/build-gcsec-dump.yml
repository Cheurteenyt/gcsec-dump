name: Build gcsec-dump (.nro)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Upload .nro artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcsec-dump-nro
          path: gcsec-dump.nro
          if-no-files-found: error
